services:
  - type: web
    name: opspilot-parser
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: OPSPILOT_FRONTEND_ORIGIN
        value: https://mcknight0521.github.io
